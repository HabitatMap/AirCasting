# Mobile app setup data, served by GET /api/v3/app_config.
#
# `post_slug` on a Learn more card is a cross-property analytics join key, not
# a local id — read docs/API_ENDPOINTS.md before touching one.
#
# Thumbnails go through the Netlify Image CDN, not the legacy `?nf_resize=`
# transform. Measured on aircastingmapdots.png at 192x192: nf_resize=smartcrop
# gives a 54.5 kB PNG, this gives a 6.0 kB WebP. nf_resize cannot emit WebP at
# all — it ignores `Accept: image/webp`. 192px covers a 64pt thumbnail at @3x.
#
#   /.netlify/images?url=<site-relative path>&w=192&h=192&fit=cover&fm=webp&q=70

default_locale: en-US

# The only tags the endpoint serves. `?locale=` is matched against this list
# exactly (case-insensitively); anything else gets default_locale, and so does
# any single string with no entry for the asked-for locale.
supported_locales:
  - en-US
  - en-GB
  - es
  - fr
  - de
  - pt
  - it

# Card labels, referenced by key from `learn_more[].category`.
categories:
  news:
    en-US: News
    es: Noticias
    fr: Actualités
    de: Neuigkeiten
    pt: Notícias
    it: Notizie
  actions: AirCasting Actions

