  "/api/v3/mobile_sessions/{uuid}/measurements":
    get:
      summary: Get measurements for a mobile session
      tags:
      - 'Mobile app: Mobile sessions'
      description: |
        One stream per call; read the names from `streams[].sensor_name` on the
        session endpoint. Omit the window to get the last 6 hours, anchored on the
        session end.

        The window bounds the answer and nothing is silently truncated — a short
        answer means there is no more data in it. Page further back by moving
        `end_time`. Both bounds are inclusive, so a point can repeat between adjacent
        pages; de-duplicate by `time`. A stream with no measurements answers `200 []`.

        Timestamps are real UTC instants — milliseconds in JSON, seconds in the
        binary frames. Nothing on the wire is local time; render local with the
        session's `time_zone`.

        ## Error codes

        | `error_code` | HTTP | When |
        |---|---|---|
        | `unauthorized` | 401 | Missing or invalid token |
        | `validation_error` | 400 | Missing `sensor_name`, half a window, `end_time <= start_time`, a window over 12h, or a non-integer time. `fields` names the offending parameter. Answered **before** the session lookup |
        | `session_not_found` | 404 | No mobile session with this uuid for this user |
        | `not_found` | 404 | The session has no stream with this `sensor_name` |
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        required: true
        description: Bearer <user_token>
        schema:
          type: string
      - name: sensor_name
        in: query
        required: true
        schema:
          type: string
        description: The one stream to read, e.g. `AirBeamMini-PM2.5`.
      - name: start_time
        in: query
        required: false
        schema:
          type: integer
        description: Epoch ms. Send with end_time; omit both for the last 6h.
      - name: end_time
        in: query
        required: false
        schema:
          type: integer
        description: Epoch ms. At most 12h after start_time.
      responses:
        '200':
          description: measurements for the named stream, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    time:
                      type: integer
                      format: int64
                      description: Epoch milliseconds (UTC)
                    value:
                      type: number
                    latitude:
                      type: number
                      format: float
                    longitude:
                      type: number
                      format: float
                example:
                - time: 1786707000000
                  value: 12.5
                  latitude: 40.0
                  longitude: -74.0
        '400':
          description: missing sensor_name, or a window over 12 hours
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                - message
                properties:
                  error_code:
                    type: string
                    example: validation_error
                  message:
                    type: string
                  fields:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                    example:
                      sensor_name:
                      - is missing
        '404':
          description: session not found, or the session has no such stream
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                - message
                properties:
                  error_code:
                    type: string
                  message:
                    type: string
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                - message
                properties:
                  error_code:
                    type: string
                  message:
                    type: string
    post:
      summary: Send binary measurements for a mobile session
      tags:
      - 'Mobile app: Mobile sessions'
      description: |
        ## Binary format

        ```
        Offset     Size  Type         Description
        0          2     uint8[2]     Magic bytes: 0xAB 0xBA
        2          2     uint16 BE    Measurement count N
        --- repeated N times (25 bytes each) ---
        +0         4     uint32 BE    Unix timestamp (seconds, UTC)
        +4         1     uint8        sensor_type_id (from session creation)
        +5         4     float32 BE   Sensor value
        +9         8     float64 BE   Latitude
        +17        8     float64 BE   Longitude
        --- end repeat ---
        4+N*25     1     uint8        XOR checksum of all preceding bytes
        ```

        Timestamps carry no milliseconds and must fall between 2020-01-01 UTC and 24
        hours ahead of server time; a frame outside that range is rejected.

        **Resends are free.** A frame whose `(stream, timestamp)` is already stored is
        skipped and the stream aggregates do not count it twice. The same holds
        inside one payload — a repeated timestamp is stored once, keeping the first
        occurrence. Order does not matter, so chunk however you like.

        An empty body returns `200`; use it to read the current server time from the
        `X-Server-Time` response header.

        ## Size limit

        At most **3000 measurements** per request, so **75005 bytes**
        (`4 + 3000 * 25 + 1`). A larger upload is refused with `413` and nothing is
        stored — split it across requests.

        ## Error codes

        | `error_code` | HTTP | Description |
        |---|---|---|
        | `unauthorized` | 401 | Missing or invalid `Authorization` token |
        | `session_not_found` | 404 | No mobile session with the given UUID for this user |
        | `unsupported_sensor_type` | 400 | A frame names a `sensor_type_id` this session has no stream for. Nothing is stored — re-read the session's streams and resend |
        | `payload_too_short` / `invalid_magic_bytes` / `empty_measurement_count` / `payload_size_mismatch` / `invalid_checksum` / `invalid_epoch` / `invalid_value` / `invalid_location` | 400 | Malformed payload |
        | `payload_too_large` | 413 | More than 3000 measurements (or more than 75005 bytes). Nothing is stored — resend in smaller batches |
        | `try_again_later` | 503 | Temporarily unavailable. Nothing is stored — resend after the `Retry-After` header (seconds) |
      parameters:
      - name: uuid
        in: path
        required: true
        description: Session UUID (same as used in session creation)
        schema:
          type: string
      - name: Authorization
        in: header
        required: true
        description: Bearer <user_token>
        schema:
          type: string
      responses:
        '200':
          description: measurements stored (or empty body time-sync)
        '400':
          description: sensor_type_id has no stream on this session
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                - message
                properties:
                  error_code:
                    type: string
                  message:
                    type: string
        '413':
          description: payload larger than one request may carry
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                - message
                properties:
                  error_code:
                    type: string
                  message:
                    type: string
        '404':
          description: session not found
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                - message
                properties:
                  error_code:
                    type: string
                  message:
                    type: string
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                - message
                properties:
                  error_code:
                    type: string
                  message:
                    type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Binary payload as described above
        required: true
  "/api/v3/station_streams/{id}":
    get:
      summary: Station stream detail (government, new model)
      tags:
      - 'Web app: Station data (government)'
      security: []
      description: A physical Station has one stream per pollutant (PM2.5 / NO2 /
        Ozone).
      parameters:
      - name: id
        in: path
        required: true
        description: station_streams.id
        schema:
          type: integer
      responses:
        '200':
          description: station stream found
          content:
            application/json:
              schema:
                type: object
                required:
                - stream
                - measurements
                - stream_daily_averages
                properties:
                  stream:
                    type: object
                    required:
                    - active
                    - title
                    - latitude
                    - longitude
                    - profile
                    - sensor_name
                    - unit_symbol
                    - update_frequency
                    - last_update
                    - session_id
                    - start_time
                    - end_time
                    - min
                    - low
                    - middle
                    - high
                    - max
                    properties:
                      active:
                        type: boolean
                        example: true
                      title:
                        type: string
                        example: Maputo
                      latitude:
                        type: number
                        format: float
                        example: 50.0
                      longitude:
                        type: number
                        format: float
                        example: 20.0
                      profile:
                        type: string
                        description: Source full name (e.g. "EEA", "US EPA AirNow")
                        example: US EPA AirNow
                      sensor_name:
                        type: string
                        description: '"Government-" + measurement type'
                        example: Government-PM2.5
                      unit_symbol:
                        type: string
                        example: µg/m³
                      update_frequency:
                        type: string
                        example: 1 hour
                      last_update:
                        type: string
                        format: date-time
                        nullable: true
                        description: Station-local wall clock (local-as-UTC)
                      session_id:
                        type: integer
                        description: station_streams.id
                        example: 4827
                      start_time:
                        type: string
                        format: date-time
                      end_time:
                        type: string
                        format: date-time
                      min:
                        type: number
                        example: 0
                      low:
                        type: number
                        example: 9
                      middle:
                        type: number
                        example: 35
                      high:
                        type: number
                        example: 55
                      max:
                        type: number
                        example: 150
                  measurements:
                    type: array
                    description: Last 2 days of station_measurements, newest first
                    items:
                      type: object
                      required:
                      - time
                      - value
                      properties:
                        time:
                          type: integer
                          format: int64
                          description: Epoch milliseconds (station-local as UTC)
                          example: 1710000000000
                        value:
                          type: number
                          format: float
                          example: 12.5
                  stream_daily_averages:
                    type: array
                    description: Daily averages for the last 3 full calendar months
                    items:
                      type: object
                      required:
                      - date
                      - value
                      properties:
                        date:
                          type: string
                          format: date
                          example: '2026-08-01'
                        value:
                          type: integer
                          example: 10
        '404':
          description: station stream not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: array
                    items:
                      type: string
