        '413':
          description: body too large for one photo
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                - message
                properties:
                  error_code:
                    type: string
                  message:
                    type: string
        '404':
          description: session not found
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                - message
                properties:
                  error_code:
                    type: string
                  message:
                    type: string
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                - message
                properties:
                  error_code:
                    type: string
                  message:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
