  "/api/v3/fixed_sessions/{uuid}/measurements":
    post:
      summary: Upload binary measurements for an AirBeamMini session
      tags:
      - 'Mobile app: AirBeam fixed streaming'
      description: |
        Receives a binary measurement payload from the AirBeamMini. Can be called once per
        minute for live uploads or in bulk after connectivity loss — both are handled identically.

        ## Binary Format

        ```
        Offset     Size  Type        Description
        0          2     uint8[2]    Magic bytes: 0xAB 0xBA
        2          2     uint16 BE   Measurement count N
        --- repeated N times ---
        4+i*9      4     uint32 BE   Unix timestamp (seconds since epoch, UTC)
        8+i*9      1     uint8       sensor_type_id (returned by session creation endpoint)
        9+i*9      4     float32 BE  Sensor value
        --- end repeat ---
        4+N*9      1     uint8       XOR checksum of all preceding bytes
        ```

        **Resend behaviour:** sending a measurement with an already-stored
        `(stream_id, time_with_time_zone)` pair is silently ignored — no duplicate is created.

        **Time synchronisation:** an empty body is valid and returns 200 immediately. The AirBeamMini
        uses this to read the current server time from the `X-Server-Time` response header
        (Unix epoch, UTC) when its clock drifts.

        ## Error Codes

        All error responses share the shape `{ "error_code": "...", "message": "..." }`.

        | `error_code` | HTTP | Description |
        |---|---|---|
        | `unauthorized` | 401 | Missing or invalid `Authorization` token |
        | `session_not_found` | 404 | No session with the given UUID exists for this user/token |
        | `payload_too_short` | 400 | Payload has fewer bytes than required for even one frame |
        | `invalid_magic_bytes` | 400 | First 2 bytes are not `0xAB 0xBA` |
        | `empty_measurement_count` | 400 | Frame count field in header is zero |
        | `payload_size_mismatch` | 400 | Actual payload size does not match the declared frame count |
        | `invalid_checksum` | 400 | XOR checksum of payload does not match the final byte |
        | `invalid_epoch` | 400 | A frame's timestamp is zero or implausibly far in the future |
        | `invalid_value` | 400 | A frame's sensor value is NaN or Infinity |
      parameters:
      - name: uuid
        in: path
        required: true
        description: Session UUID (same as used in session creation)
        schema:
          type: string
      - name: Authorization
        in: header
        required: true
        description: 'Mobile app: `Token token=<user_token>`. AirBeam: `Bearer <session_token>`
          (returned by session creation endpoint).'
        schema:
          type: string
      responses:
        '200':
          description: measurements stored (or empty body time-sync)
        '400':
          description: invalid payload or unknown sensor_type_id
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                - message
                properties:
                  error_code:
                    type: string
                  message:
                    type: string
        '404':
          description: session not found
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                - message
                properties:
                  error_code:
                    type: string
                  message:
                    type: string
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                - message
                properties:
                  error_code:
                    type: string
                  message:
                    type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Binary payload as described in the endpoint description
        required: true
  "/api/v3/fixed_streams/{id}":
    get:
      summary: Fixed stream detail with recent measurements and daily averages
      tags:
      - 'Web app: Fixed sessions'
      security: []
      description: |
        Returns one AirBeam fixed stream (legacy `streams.id`) with the last 2 days of
        measurements and the last 3 full calendar months of daily averages. Public (no auth).

        Times: measurement `time` is epoch **milliseconds** in local-as-UTC (station-local
        wall clock encoded as a UTC epoch). `stream.start_time`/`end_time`/`last_update` are
        ISO 8601 date-times. Station (government) data uses `/api/v3/station_streams/{id}` instead.
      parameters:
      - name: id
        in: path
        required: true
        description: Legacy streams.id
        schema:
          type: integer
      responses:
        '200':
          description: stream found
          content:
            application/json:
              schema:
                type: object
                required:
                - stream
                - measurements
                - stream_daily_averages
                properties:
                  stream:
                    type: object
                    required:
                    - active
                    - title
                    - latitude
                    - longitude
                    - profile
                    - sensor_name
                    - unit_symbol
                    - update_frequency
                    - last_update
                    - session_id
                    - start_time
                    - end_time
                    - min
                    - low
                    - middle
                    - high
                    - max
                    properties:
                      active:
                        type: boolean
                        example: true
                      title:
                        type: string
                        example: Rooftop monitor
                      latitude:
                        type: number
                        format: float
                        example: 40.7128
                      longitude:
                        type: number
                        format: float
                        example: -74.006
                      profile:
                        type: string
                        description: Owner username, or "anonymous" for indoor sessions
                        example: jane
                      sensor_name:
                        type: string
                        example: AirBeam-PM2.5
                      unit_symbol:
                        type: string
                        example: µg/m³
                      update_frequency:
                        type: string
                        example: 1 minute
                      last_update:
                        type: string
                        format: date-time
                        nullable: true
                      session_id:
                        type: integer
                        description: Legacy sessions.id
                        example: 1234
                      start_time:
                        type: string
                        format: date-time
                      end_time:
                        type: string
                        format: date-time
                      min:
                        type: number
                        description: Threshold very low
                        example: 0
                      low:
                        type: number
                        example: 9
                      middle:
                        type: number
                        example: 35
                      high:
                        type: number
                        example: 55
                      max:
                        type: number
                        description: Threshold very high
                        example: 150
                  measurements:
                    type: array
                    description: Last 2 days of measurements, newest first
                    items:
                      type: object
                      required:
                      - time
                      - value
                      properties:
                        time:
                          type: integer
                          format: int64
                          description: Epoch milliseconds (local-as-UTC)
                          example: 1710000000000
                        value:
                          type: number
                          format: float
                          example: 12.5
                  stream_daily_averages:
                    type: array
                    description: Daily averages for the last 3 full calendar months
                    items:
                      type: object
                      required:
                      - date
                      - value
                      properties:
                        date:
                          type: string
                          format: date
                          example: '2026-08-01'
                        value:
                          type: integer
                          description: Rounded daily average
                          example: 14
