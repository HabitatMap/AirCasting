                tag_list:
                  type: string
                  nullable: true
                  example: commute, bike
                  description: Space/comma separated tags.
                latitude:
                  type: number
                  format: float
                  nullable: true
                  example: 40.7128
                  description: Optional session start point.
                longitude:
                  type: number
                  format: float
                  nullable: true
                  example: -74.006
                airbeam:
                  type: object
                  required:
                  - mac_address
                  - model
                  properties:
                    mac_address:
                      type: string
                      example: AA:BB:CC:DD:EE:FF
                    model:
                      type: string
                      example: AirBeamMini
                    name:
                      type: string
                      nullable: true
                      example: My AirBeam
                streams:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                    - sensor_name
                    - unit_symbol
                    properties:
                      sensor_name:
                        type: string
                        example: AirBeamMini-PM2.5
                      unit_symbol:
