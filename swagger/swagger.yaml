                      properties:
                        time:
                          type: integer
                          format: int64
                          description: Epoch milliseconds (local-as-UTC)
                          example: 1710000000000
                        value:
                          type: number
                          format: float
                          example: 12.5
                  stream_daily_averages:
                    type: array
