                          type: number
                        threshold_very_high:
                          type: number
                        measurements:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              stream_id:
                                type: integer
                              value:
                                type: number
                              time:
                                type: string
                                description: UTC ISO 8601 with ms
                              latitude:
                                type: number
                                format: float
                              longitude:
                                type: number
                                format: float
                              milliseconds:
                                type: integer
                                example: 0
