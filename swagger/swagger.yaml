      tags:
      - 'Mobile app: Fixed sessions [DEPRECATED]'
      deprecated: true
      security:
      - basic_auth: []
      description: |
        **Deprecated** — use `POST /api/v3/fixed_sessions`.

        Uploading the same `uuid` twice concurrently yields one session; both callers
        receive the same `location`. A `uuid` that already existed before the request
        is a bodiless `400`.
      parameters: []
      responses:
        '200':
          description: created
          content:
            application/json:
              schema:
                type: object
                required:
                - location
                - notes
                properties:
                  location:
                    type: string
                  notes:
                    type: array
                    items:
                      type: object
                      properties:
