                    required:
                    - active
                    - title
                    - latitude
                    - longitude
                    - profile
                    - sensor_name
                    - unit_symbol
                    - update_frequency
                    - last_update
                    - session_id
                    - start_time
                    - end_time
                    - min
                    - low
                    - middle
                    - high
                    - max
                    properties:
                      active:
                        type: boolean
                        example: true
                      title:
                        type: string
                        example: Rooftop monitor
                      latitude:
                        type: number
                        format: float
                        example: 40.7128
                      longitude:
                        type: number
                        format: float
                        example: -74.006
                      profile:
                        type: string
                        description: Owner username, or "anonymous" for indoor sessions
                        example: jane
                      sensor_name:
                        type: string
                        example: AirBeam-PM2.5
                      unit_symbol:
                        type: string
                        example: µg/m³
                      update_frequency:
                        type: string
                        example: 1 minute
                      last_update:
                        type: string
                        format: date-time
                        nullable: true
                      session_id:
                        type: integer
                        description: Legacy sessions.id
                        example: 1234
                      start_time:
                        type: string
                        format: date-time
                      end_time:
                        type: string
                        format: date-time
                      min:
                        type: number
                        description: Threshold very low
                        example: 0
                      low:
                        type: number
                        example: 9
                      middle:
                        type: number
                        example: 35
                      high:
                        type: number
                        example: 55
                      max:
                        type: number
                        description: Threshold very high
                        example: 150
                  measurements:
                    type: array
                    description: Last 2 days of measurements, newest first
                    items:
                      type: object
                      required:
                      - time
