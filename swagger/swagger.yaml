  "/api/user/sessions/sync_with_versioning.json":
    post:
      summary: Sync sessions (diff of what to upload/download/delete)
      tags:
      - 'Mobile app: Sessions & sync'
      description: |
        Given the app's local session list (uuid + version + deleted), returns which UUIDs
        to upload, download, and mark deleted. Auth required. `data` is a JSON **string**
        (a JSON array), not a JSON object body.
      parameters: []
      responses:
        '200':
          description: sync diff
          content:
            application/json:
              schema:
                type: object
                required:
                - upload
                - download
                - deleted
                properties:
                  upload:
                    type: array
                    items:
                      type: string
                  download:
                    type: array
                    items:
                      type: string
                  deleted:
                    type: array
                    items:
                      type: string
        '400':
          description: validation error
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Per-item validation errors keyed by array index
                example:
                  data:
                    '0':
                      deleted:
                      - is missing
                      version:
                      - is missing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: string
                  description: 'JSON array string: [{uuid, deleted(bool), version(int)}]'
                  example: '[{"uuid":"abc","deleted":false,"version":3}]'
        required: true
