---
openapi: 3.0.1
info:
  title: AirCasting Mobile & Web API
  version: 1.0.0
  description: Endpoints used by the AirCasting mobile apps and web frontend.
components:
  securitySchemes:
    token_auth:
      type: apiKey
      in: header
      name: Authorization
      description: Token token=<user_token>
security:
- token_auth: []
tags:
- name: 'Mobile app: Account & auth'
  description: 'iOS/Android: sign in/up, user settings, account deletion, password
    reset.'
- name: 'Mobile app: Sessions & sync'
  description: 'iOS/Android: upload/update AirBeam mobile sessions, sync, download
    session metadata, email export.'
- name: 'Mobile app: AirBeam fixed streaming'
  description: 'iOS/Android: create AirBeam fixed sessions and upload measurements
    — the new AirBeamMini binary flow (POST /api/v3/fixed_sessions[/{uuid}/measurements])
    and the legacy realtime (WiFi) flow — plus poll for new measurements.'
- name: 'Mobile app: Fixed map & streams'
  description: 'iOS/Android: active AirBeam fixed sessions in a bounding box, fixed
    session/stream detail with measurements.'
- name: 'Mobile app: Threshold alerts'
  description: 'iOS/Android: manage threshold (push-notification) alerts.'
- name: 'Web app: Fixed sessions'
  description: 'Web frontend: AirBeam fixed (roof-mounted) stream detail, measurements,
    daily averages, and the fixed map lists (these lists also carry Station/government
    data).'
- name: 'Web app: Mobile sessions'
  description: 'Web frontend: AirBeam mobile (moving) session list and single stream
    detail.'
- name: 'Web app: Station data (government)'
  description: 'Web frontend: Station data — government (EEA/EPA) integration, in
    the station_streams / station_measurements model: station stream detail, measurements,
    daily averages, CSV export.'
- name: 'Web app: Map aggregations'
  description: 'Web frontend: CrowdMap grid averages, region summary, timelapse clusters.'
- name: 'Web app: Autocomplete'
  description: 'Web frontend: filter autocomplete for tag names and usernames.'
- name: 'Web app: Sensors & thresholds'
  description: 'Web frontend: sensor lists and threshold sets. (Mobile apps do not
    call these — they receive threshold values embedded in session/stream responses.)'
- name: 'Web app: Export & sharing'
  description: 'Web frontend: session CSV export and short-URL creation.'
paths:
  "/api/fixed/autocomplete/tags":
    get:
      summary: Autocomplete fixed-session tag names
      tags:
      - 'Web app: Autocomplete'
      security: []
      description: Returns matching fixed-session tag names as a string array. Public
        (no auth). Uses nested q[...] params.
      parameters:
      - name: q[input]
        in: query
        required: false
        description: Search prefix (may be empty)
        schema:
          type: string
      - name: q[time_from]
        in: query
        required: true
        description: Epoch seconds
        schema:
          type: integer
      - name: q[time_to]
        in: query
        required: true
        description: Epoch seconds
        schema:
          type: integer
      - name: q[sensor_name]
        in: query
        required: true
        schema:
          type: string
      - name: q[unit_symbol]
        in: query
        required: true
        schema:
          type: string
      - name: q[usernames]
        in: query
        required: false
        description: Cross-filter usernames (may be empty)
        schema:
          type: string
      - name: q[west]
        in: query
        required: true
        schema:
          type: number
      - name: q[east]
        in: query
        required: true
        schema:
          type: number
      - name: q[south]
        in: query
        required: true
        schema:
          type: number
      - name: q[north]
        in: query
        required: true
        schema:
          type: number
      - name: q[is_indoor]
        in: query
        required: true
        schema:
          type: boolean
      - name: q[is_active]
        in: query
        required: true
        schema:
          type: boolean
      responses:
        '200':
          description: tag names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  "/api/mobile/autocomplete/tags":
    get:
      summary: Autocomplete mobile-session tag names
      tags:
      - 'Web app: Autocomplete'
      security: []
      description: Returns matching mobile-session tag names as a string array. Public
        (no auth). Uses nested q[...] params.
      parameters:
      - name: q[input]
        in: query
        required: false
        description: Search prefix (may be empty)
        schema:
          type: string
      - name: q[time_from]
        in: query
        required: true
        description: Epoch seconds
        schema:
          type: integer
      - name: q[time_to]
        in: query
        required: true
        description: Epoch seconds
        schema:
          type: integer
      - name: q[sensor_name]
        in: query
        required: true
        schema:
          type: string
      - name: q[unit_symbol]
        in: query
        required: true
        schema:
          type: string
      - name: q[usernames]
        in: query
        required: false
        schema:
          type: string
      - name: q[west]
        in: query
        required: true
        schema:
          type: number
      - name: q[east]
        in: query
        required: true
        schema:
          type: number
      - name: q[south]
        in: query
        required: true
        schema:
          type: number
      - name: q[north]
        in: query
        required: true
        schema:
          type: number
      responses:
        '200':
          description: tag names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  "/api/autocomplete/usernames":
    get:
      summary: Autocomplete usernames
      tags:
      - 'Web app: Autocomplete'
      security: []
      description: 'Returns matching contributor usernames as a sorted, unique string
        array. Public (no auth). Uses nested q[...] params. Note: is_dormant is a
        string "true"/"false", session_type is "fixed" or "mobile".'
      parameters:
      - name: q[input]
        in: query
        required: false
        description: Search prefix (may be empty)
        schema:
          type: string
      - name: q[time_from]
        in: query
        required: true
        description: Epoch seconds
        schema:
          type: integer
      - name: q[time_to]
        in: query
        required: true
        description: Epoch seconds
        schema:
          type: integer
      - name: q[sensor_name]
        in: query
        required: true
        schema:
          type: string
      - name: q[unit_symbol]
        in: query
        required: true
        schema:
          type: string
      - name: q[tags]
        in: query
        required: false
        description: Cross-filter tags (may be empty)
        schema:
          type: string
      - name: q[west]
        in: query
        required: true
        schema:
          type: number
      - name: q[east]
        in: query
        required: true
        schema:
          type: number
      - name: q[south]
        in: query
        required: true
        schema:
          type: number
      - name: q[north]
        in: query
        required: true
        schema:
          type: number
      - name: q[session_type]
        in: query
        required: true
        description: '"fixed" or "mobile"'
        schema:
          type: string
      - name: q[is_dormant]
        in: query
        required: true
        description: '"true" or "false"'
        schema:
          type: string
      responses:
        '200':
          description: usernames
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  "/api/averages2.json":
    get:
      summary: CrowdMap grid-cell averages in a bounding box
      tags:
      - 'Web app: Map aggregations'
      security: []
      description: |
        Returns averaged measurement values over a grid, for the CrowdMap. Public (no auth).
        `q` is URL-encoded JSON with: `north`, `south`, `east`, `west` (float);
        `time_from`, `time_to`, `day_from`, `day_to`, `year_from`, `year_to`,
        `grid_size_x`, `grid_size_y` (int); `measurement_type`, `sensor_name`,
        `unit_symbol`, `usernames`, `tags` (string); `stream_ids` (array of int, optional).
      parameters:
      - name: q
        in: query
        required: true
        description: URL-encoded JSON filter
        schema:
          type: string
      responses:
        '200':
          description: grid averages
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - value
                  - west
                  - east
                  - south
                  - north
                  properties:
                    value:
                      type: number
                      format: float
                    west:
                      type: number
                      format: float
                    east:
                      type: number
                      format: float
                    south:
                      type: number
                      format: float
                    north:
                      type: number
                      format: float
  "/api/region.json":
    get:
      summary: Region summary (average, contributors, samples)
      tags:
      - 'Web app: Map aggregations'
      security: []
      description: |
        Returns a summary for a rectangular region. Public (no auth). Uses **flat** query
        params (not a `q` wrapper): `north`, `south`, `east`, `west` (float);
        `time_from`, `time_to`, `grid_size_x`, `grid_size_y` (int); `usernames`,
        `tags` (string); `stream_ids` (comma-separated string).
      parameters:
      - name: north
        in: query
        required: true
        schema:
          type: number
      - name: south
        in: query
        required: true
        schema:
          type: number
      - name: east
        in: query
        required: true
        schema:
          type: number
      - name: west
        in: query
        required: true
        schema:
          type: number
      - name: time_from
        in: query
        required: false
        description: Epoch seconds
        schema:
          type: integer
      - name: time_to
        in: query
        required: false
        description: Epoch seconds
        schema:
          type: integer
      - name: sensor_name
        in: query
        required: false
        schema:
          type: string
      - name: measurement_type
        in: query
        required: false
        schema:
          type: string
      - name: unit_symbol
        in: query
        required: false
        schema:
          type: string
      - name: usernames
        in: query
        required: false
        schema:
          type: string
      - name: tags
        in: query
        required: false
        schema:
          type: string
      - name: stream_ids
        in: query
        required: false
        description: Comma-separated stream ids
        schema:
          type: string
      responses:
        '200':
          description: region summary
          content:
            application/json:
              schema:
                type: object
                required:
                - average
                - number_of_contributors
                - number_of_samples
                properties:
                  average:
                    type: number
                    format: float
                    nullable: true
                  number_of_contributors:
                    type: integer
                  number_of_samples:
                    type: integer
  "/api/v3/timelapse":
    get:
      summary: Timelapse clusters by hour
      tags:
      - 'Web app: Map aggregations'
      security: []
      description: |
        Returns clustered hourly averages for the timelapse animation. Public (no auth).
        Response is an object keyed by hour timestamp ("YYYY-MM-DD HH:MM:SS +0000"),
        each value an array of cluster points. `q` is URL-encoded JSON validated by the
        same contract as the fixed session lists (required: `time_from`, `time_to`
        (epoch seconds), `sensor_name`, `measurement_type`, `unit_symbol`, `tags`,
        `usernames`; optional bbox + `zoom_level`). Station (government) sensors are supported.
      parameters:
      - name: q
        in: query
        required: true
        description: URL-encoded JSON filter
        schema:
          type: string
      responses:
        '200':
          description: clusters keyed by hour
          content:
            application/json:
              schema:
                type: object
                description: Keyed by hour timestamp
                example:
                  '2026-08-12 10:00:00 +0000':
                  - value: 12.0
                    latitude: 40.7
                    longitude: -74.0
                    sessions: 3
                additionalProperties:
                  type: array
                  items:
                    type: object
                    required:
                    - value
                    - latitude
                    - longitude
                    - sessions
                    properties:
                      value:
                        type: number
                        format: float
                      latitude:
                        type: number
                        format: float
                      longitude:
                        type: number
                        format: float
                      sessions:
                        type: integer
                        description: Number of streams in the cluster
  "/api/sessions/export.json":
    get:
      summary: Schedule a CSV export of sessions (emailed)
      tags:
      - 'Web app: Export & sharing'
      security: []
      description: |
        Schedules a background CSV export of the given sessions and emails the result.
        Public (no auth). All ids must be the same kind (all mobile or all fixed) and,
        for fixed sessions, must include streams.
      parameters:
      - name: session_ids[]
        in: query
        required: true
        schema:
          type: array
          items:
            type: integer
        style: form
        explode: true
        description: sessions.id list
      - name: email
        in: query
        required: true
        description: Recipient email
        schema:
          type: string
      responses:
        '200':
          description: export scheduled
          content:
            application/json:
              schema:
                type: string
                example: Export scheduled successfully.
        '400':
          description: validation error
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                example:
                  field_name:
                  - error message
  "/api/short_url":
    post:
      summary: Shorten a same-host URL
      tags:
      - 'Web app: Export & sharing'
      security: []
      description: Creates a shortened link for a URL on the same host. Public (no
        auth). Returns the shortened URL; off-host URLs are rejected with 422.
      parameters: []
      responses:
        '200':
          description: shortened
          content:
            application/json:
              schema:
                type: object
                required:
                - short_url
                properties:
                  short_url:
                    type: string
                    example: http://www.example.com/l/abc12
        '422':
          description: invalid or off-host URL
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Invalid URL
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - longUrl
              properties:
                longUrl:
                  type: string
                  example: http://www.example.com/fixed_map?foo=bar
        required: true
  "/api/fixed/active/sessions2.json":
    get:
      summary: Active fixed sessions in a bounding box (AirBeam fixed + Station/government)
      tags:
      - 'Web app: Fixed sessions'
      security: []
      description: |
        Returns active fixed sessions as map markers. Public (no auth). Response is gzipped.

        URL-encoded JSON object. Fields:
        required `time_from`, `time_to` (Unix epoch **seconds**), `sensor_name`,
        `measurement_type`, `unit_symbol`, `tags` (string, may be empty),
        `usernames` (string, may be empty); optional `is_indoor` (bool),
        `west`/`east`/`south`/`north` (float), `limit`/`offset`/`zoom_level` (int).
        A `sensor_name` of government-pm2.5 / government-no2 / government-ozone
        returns Station (government) data from the station_streams model.
      parameters:
      - name: q
        in: query
        required: true
        description: |
          URL-encoded JSON object. Fields:
          required `time_from`, `time_to` (Unix epoch **seconds**), `sensor_name`,
          `measurement_type`, `unit_symbol`, `tags` (string, may be empty),
          `usernames` (string, may be empty); optional `is_indoor` (bool),
          `west`/`east`/`south`/`north` (float), `limit`/`offset`/`zoom_level` (int).
          A `sensor_name` of government-pm2.5 / government-no2 / government-ozone
          returns Station (government) data from the station_streams model.
        schema:
          type: string
      responses:
        '200':
          description: active sessions
          content:
            application/json:
              schema:
                type: object
                required:
                - fetchableSessionsCount
                - sessions
                properties:
                  fetchableSessionsCount:
                    type: integer
                    example: 0
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: 'AirBeam fixed: sessions.id. Station (government):
                            station_streams.id'
                        uuid:
                          type: string
                        end_time_local:
                          type: string
                          nullable: true
                          description: Local wall time, e.g. 2026-08-01T10:00:00.000Z
                        start_time_local:
                          type: string
                          nullable: true
                        last_measurement_value:
                          type: integer
                          nullable: true
                        is_indoor:
                          type: boolean
                        latitude:
                          type: number
                          format: float
                        longitude:
                          type: number
                          format: float
                        title:
                          type: string
                        username:
                          type: string
                          description: AirBeam owner username / "anonymous" (indoor);
                            "Government" for Station (government) rows
                        is_active:
                          type: boolean
                        last_hourly_average_value:
                          type: number
                          nullable: true
                          description: AirBeam branch only
                        streams:
                          type: object
                          description: Keyed by sensor_name
                          additionalProperties:
                            type: object
                            properties:
                              measurement_short_type:
                                type: string
                                example: PM
                              sensor_name:
                                type: string
                                example: AirBeam2-PM2.5
                              unit_symbol:
                                type: string
                                example: µg/m³
                              id:
                                type: integer
                              stream_daily_average:
                                description: 'AirBeam branch only: rounded integer
                                  or the string "no data"'
                                example: 12
                          example:
                            AirBeam2-PM2.5:
                              measurement_short_type: PM
                              sensor_name: AirBeam2-PM2.5
                              unit_symbol: µg/m³
                              id: 123
                              stream_daily_average: 12
        '400':
          description: validation error (invalid q)
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                example:
                  field_name:
                  - error message
  "/api/fixed/dormant/sessions.json":
    get:
      summary: Dormant fixed sessions in a bounding box (AirBeam fixed + Station/government)
      tags:
      - 'Web app: Fixed sessions'
      security: []
      description: |
        Returns dormant (inactive) fixed sessions with full per-stream metadata. Public (no auth).

        URL-encoded JSON object. Fields:
        required `time_from`, `time_to` (Unix epoch **seconds**), `sensor_name`,
        `measurement_type`, `unit_symbol`, `tags` (string, may be empty),
        `usernames` (string, may be empty); optional `is_indoor` (bool),
        `west`/`east`/`south`/`north` (float), `limit`/`offset`/`zoom_level` (int).
        A `sensor_name` of government-pm2.5 / government-no2 / government-ozone
        returns Station (government) data from the station_streams model.
      parameters:
      - name: q
        in: query
        required: true
        description: |
          URL-encoded JSON object. Fields:
          required `time_from`, `time_to` (Unix epoch **seconds**), `sensor_name`,
          `measurement_type`, `unit_symbol`, `tags` (string, may be empty),
          `usernames` (string, may be empty); optional `is_indoor` (bool),
          `west`/`east`/`south`/`north` (float), `limit`/`offset`/`zoom_level` (int).
          A `sensor_name` of government-pm2.5 / government-no2 / government-ozone
          returns Station (government) data from the station_streams model.
        schema:
          type: string
      responses:
        '200':
          description: dormant sessions
          content:
            application/json:
              schema:
                type: object
                required:
                - sessions
                - fetchableSessionsCount
                properties:
                  fetchableSessionsCount:
                    type: integer
                    example: 0
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        start_time_local:
                          type: string
                        end_time_local:
                          type: string
                        is_indoor:
                          type: boolean
                        latitude:
                          type: number
                          format: float
                        longitude:
                          type: number
                          format: float
                        type:
                          type: string
                          description: STI class, e.g. FixedSession
                        username:
                          type: string
                        last_hourly_average_value:
                          type: number
                          nullable: true
                        streams:
                          type: object
                          description: Keyed by sensor_name
                          additionalProperties:
                            type: object
                            properties:
                              average_value:
                                type: number
                                nullable: true
                              id:
                                type: integer
                              max_latitude:
                                type: number
                                format: float
                              max_longitude:
                                type: number
                                format: float
                              measurement_short_type:
                                type: string
                              measurement_type:
                                type: string
                              measurements_count:
                                type: integer
                              min_latitude:
                                type: number
                                format: float
                              min_longitude:
                                type: number
                                format: float
                              sensor_name:
                                type: string
                              sensor_package_name:
                                type: string
                              session_id:
                                type: integer
                              size:
                                type: integer
                              start_latitude:
                                type: number
                                format: float
                              start_longitude:
                                type: number
                                format: float
                              threshold_high:
                                type: number
                              threshold_low:
                                type: number
                              threshold_medium:
                                type: number
                              threshold_very_high:
                                type: number
                              threshold_very_low:
                                type: number
                              unit_name:
                                type: string
                              unit_symbol:
                                type: string
                          example:
                            AirBeam2-PM2.5:
                              average_value: 12
                              id: 123
                              sensor_name: AirBeam2-PM2.5
                              sensor_package_name: AirBeam2:00189610719F
                              measurement_type: Particulate Matter
                              measurement_short_type: PM
                              unit_name: microgram per cubic meter
                              unit_symbol: µg/m³
                              measurements_count: 1440
                              session_id: 456
                              size: 1440
                              min_latitude: 40.7
                              max_latitude: 40.8
                              min_longitude: -74.01
                              max_longitude: -73.99
                              start_latitude: 40.7
                              start_longitude: -74.0
                              threshold_very_low: 0
                              threshold_low: 9
                              threshold_medium: 35
                              threshold_high: 55
                              threshold_very_high: 150
  "/api/user.json":
    get:
      summary: Sign in (fetch the current user)
      tags:
      - 'Mobile app: Account & auth'
      description: 'Returns the authenticated user. Auth: `Token token=<user_token>`
        via HTTP Basic (token as username, "X" as password).'
      responses:
        '200':
          description: user
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - email
                - username
                - authentication_token
                - session_stopped_alert
                properties:
                  id:
                    type: integer
                  email:
                    type: string
                  username:
                    type: string
                  authentication_token:
                    type: string
                    description: API token; sent back as the HTTP Basic username on
                      authenticated requests
                  session_stopped_alert:
                    type: boolean
    post:
      summary: Sign up (create an account)
      tags:
      - 'Mobile app: Account & auth'
      security: []
      description: Creates a new user account. No auth.
      parameters: []
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - email
                - username
                - authentication_token
                - session_stopped_alert
                properties:
                  id:
                    type: integer
                  email:
                    type: string
                  username:
                    type: string
                  authentication_token:
                    type: string
                    description: API token; sent back as the HTTP Basic username on
                      authenticated requests
                  session_stopped_alert:
                    type: boolean
        '422':
          description: validation error
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                example:
                  field_name:
                  - error message
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - user
              properties:
                user:
                  type: object
                  required:
                  - username
                  - email
                  - password
                  - password_confirmation
                  properties:
                    username:
                      type: string
                    email:
                      type: string
                    password:
                      type: string
                    password_confirmation:
                      type: string
