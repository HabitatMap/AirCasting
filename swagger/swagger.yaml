        schema:
          type: integer
        description: 1-based page (with per_page)
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
        description: Page size; omit for the full set
      responses:
        '200':
          description: sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    uuid:
                      type: string
                    title:
                      type: string
                    type:
                      type: string
                      example: MobileSession
