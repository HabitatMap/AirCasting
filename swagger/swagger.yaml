                        type: string
                        example: AirBeamMini-PM1
                      sensor_package_name:
                        type: string
                      deleted:
                        type: boolean
                        example: true
                airbeam:
                  type: object
                  properties:
                    mac_address:
                      type: string
                      example: AA:BB:CC:DD:EE:FF
                    model:
                      type: string
                      example: AirBeamMini
                    name:
                      type: string
                      nullable: true
                      example: Backpack
        required: true
  "/api/v3/mobile_sessions/{uuid}/measurements":
    get:
      summary: Get measurements for a mobile session
      tags:
      - 'Mobile app: Sessions & sync'
      description: |
        Returns measurements for the session, keyed by sensor_name, each an array
        of `{ time, value, latitude, longitude }`. Defaults to the **latest 24h**
        (anchored on the session end) for a light initial fetch; pass
        `start_time` / `end_time` (epoch **milliseconds**) to pull any older range.
        Optional `sensor_name` / `measurement_type` fetch a single stream.
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        required: true
        description: Token token=<user_token>
        schema:
          type: string
      - name: sensor_name
        in: query
        required: false
        schema:
          type: string
      - name: measurement_type
        in: query
        required: false
        schema:
          type: string
      - name: start_time
        in: query
        required: false
        schema:
          type: integer
        description: Epoch ms (defaults to end - 24h)
      - name: end_time
        in: query
        required: false
        schema:
          type: integer
        description: Epoch ms (defaults to session end)
      responses:
        '200':
          description: measurements keyed by sensor_name
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: object
                    properties:
                      time:
                        type: string
                        description: ISO 8601 (local-as-utc)
                      value:
                        type: number
                      latitude:
                        type: number
                        format: float
                      longitude:
                        type: number
                        format: float
                example:
                  AirBeamMini-PM2.5:
                  - time: '2026-08-14T11:30:00.000Z'
                    value: 12.5
                    latitude: 40.0
                    longitude: -74.0
        '404':
          description: session not found
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                - message
                properties:
                  error_code:
                    type: string
                  message:
                    type: string
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                - message
                properties:
                  error_code:
                    type: string
                  message:
                    type: string
    post:
      summary: Send binary measurements for a mobile session
      tags:
      - 'Mobile app: Sessions & sync'
      description: |
        Uploads AirBeam mobile measurements as a binary payload. Authenticated with
        the **user token** (no per-session token). Can be called live during a
        recording or in bulk to sync measurements the AirBeam delivered late.

        ## Binary Format

        Each frame extends the fixed frame with per-point location. **No
        milliseconds** — mobile records at interval sampling (1s / 5s / 1 / 5 / 10 min).

        ```
        Offset     Size  Type         Description
        0          2     uint8[2]     Magic bytes: 0xAB 0xBA
        2          2     uint16 BE    Measurement count N
        --- repeated N times (25 bytes each) ---
        +0         4     uint32 BE    Unix timestamp (seconds, UTC)
        +4         1     uint8        sensor_type_id (from session creation)
        +5         4     float32 BE   Sensor value
        +9         8     float64 BE   Latitude
        +17        8     float64 BE   Longitude
        --- end repeat ---
        4+N*25     1     uint8        XOR checksum of all preceding bytes
        ```

        On ingest the session's start/end are refined from the measurement bounds
        and the stream aggregates (bounding box, average, start coordinates) are
        recomputed. An empty body returns 200 (reads server time from `X-Server-Time`).

        ## Error Codes

        | `error_code` | HTTP | Description |
        |---|---|---|
        | `unauthorized` | 401 | Missing or invalid `Authorization` token |
        | `session_not_found` | 404 | No mobile session with the given UUID for this user |
        | `payload_too_short` / `invalid_magic_bytes` / `empty_measurement_count` / `payload_size_mismatch` / `invalid_checksum` / `invalid_epoch` / `invalid_value` / `invalid_location` | 400 | Malformed payload |
      parameters:
      - name: uuid
        in: path
        required: true
        description: Session UUID (same as used in session creation)
        schema:
          type: string
      - name: Authorization
        in: header
        required: true
        description: Token token=<user_token>
        schema:
          type: string
      responses:
        '200':
          description: measurements stored (or empty body time-sync)
        '400':
          description: invalid payload
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                - message
                properties:
                  error_code:
                    type: string
                  message:
                    type: string
        '404':
          description: session not found
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                - message
                properties:
                  error_code:
                    type: string
                  message:
                    type: string
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                - message
                properties:
                  error_code:
                    type: string
                  message:
                    type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Binary payload as described above
        required: true
  "/api/v3/station_streams/{id}":
    get:
      summary: Station stream detail (government, new model)
      tags:
      - 'Web app: Station data (government)'
      security: []
      description: |
        Returns one Station (government) pollutant stream (`station_streams.id`) from the new model,
        with the last 2 days of `station_measurements` and 3 months of daily averages.
        Public (no auth). A physical Station has one such stream per pollutant
        (PM2.5 / NO2 / Ozone).
      parameters:
      - name: id
        in: path
        required: true
        description: station_streams.id
        schema:
          type: integer
      responses:
        '200':
          description: station stream found
          content:
            application/json:
              schema:
                type: object
                required:
                - stream
                - measurements
                - stream_daily_averages
                properties:
                  stream:
                    type: object
                    required:
                    - active
                    - title
                    - latitude
                    - longitude
                    - profile
                    - sensor_name
                    - unit_symbol
                    - update_frequency
                    - last_update
                    - session_id
                    - start_time
                    - end_time
                    - min
                    - low
                    - middle
                    - high
                    - max
                    properties:
                      active:
                        type: boolean
                        example: true
                      title:
                        type: string
                        example: Maputo
                      latitude:
                        type: number
                        format: float
                        example: 50.0
                      longitude:
                        type: number
                        format: float
                        example: 20.0
                      profile:
                        type: string
                        description: Source full name (e.g. "EEA", "US EPA AirNow")
                        example: US EPA AirNow
                      sensor_name:
                        type: string
                        description: '"Government-" + measurement type'
                        example: Government-PM2.5
                      unit_symbol:
                        type: string
                        example: µg/m³
                      update_frequency:
                        type: string
                        example: 1 hour
                      last_update:
                        type: string
                        format: date-time
                        nullable: true
                        description: Station-local wall clock (local-as-UTC)
                      session_id:
                        type: integer
                        description: station_streams.id
                        example: 4827
                      start_time:
                        type: string
                        format: date-time
                      end_time:
                        type: string
                        format: date-time
                      min:
                        type: number
                        example: 0
                      low:
                        type: number
                        example: 9
                      middle:
                        type: number
                        example: 35
                      high:
                        type: number
                        example: 55
                      max:
                        type: number
                        example: 150
                  measurements:
                    type: array
                    description: Last 2 days of station_measurements, newest first
                    items:
                      type: object
                      required:
                      - time
                      - value
                      properties:
                        time:
                          type: integer
                          format: int64
                          description: Epoch milliseconds (station-local as UTC)
                          example: 1710000000000
                        value:
                          type: number
                          format: float
                          example: 12.5
                  stream_daily_averages:
                    type: array
                    items:
                      type: object
                      required:
                      - date
                      - value
                      properties:
                        date:
                          type: string
                          format: date
                          example: '2026-08-01'
                        value:
                          type: integer
                          example: 10
        '404':
          description: station stream not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: array
                    items:
                      type: string
  "/api/v3/station_streams/export":
    get:
      summary: Export Station (government) streams as CSV (emailed)
      tags:
      - 'Web app: Station data (government)'
      security: []
      description: |
        Schedules a background CSV export of the given `station_stream_ids` and emails the
        result. Public (no auth). At most 100
        station streams per request.
      parameters:
      - name: station_stream_ids[]
        in: query
        required: true
        schema:
          type: array
          items:
            type: integer
        style: form
        explode: true
        description: station_streams.id list (max 100)
      - name: email
        in: query
        required: true
        description: Recipient email address
        schema:
          type: string
      responses:
        '200':
          description: export scheduled
          content:
            application/json:
              schema:
                type: string
                example: Export scheduled successfully.
        '400':
          description: validation error
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                example:
                  field_name:
                  - error message
