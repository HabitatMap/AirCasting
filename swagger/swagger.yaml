  "/api/thresholds/{id}":
    get:
      summary: Threshold set for a sensor
      tags:
      - 'Web app: Sensors & thresholds'
      security: []
      description: |
        Returns the default (or most popular) threshold set for a sensor as an ordered
        array of 5 stringified integers: `[very_low, low, medium, high, very_high]`.
        Public (no auth). `id` is the sensor name and may contain dots/slashes.
      parameters:
      - name: id
        in: path
        required: true
        description: Sensor name (e.g. AirBeam-PM2.5, Government-PM2.5)
        schema:
          type: string
      - name: unit_symbol
        in: query
        required: true
        description: Unit symbol (e.g. µg/m³, ppb)
        schema:
          type: string
      responses:
        '200':
          description: threshold set
          content:
            application/json:
              schema:
                type: array
                minItems: 5
                maxItems: 5
                items:
                  type: string
                  description: Stringified integer threshold
                example:
                - '0'
                - '9'
                - '35'
                - '55'
                - '150'
  "/api/sensors":
    get:
      summary: Sensors available for a session type
      tags:
      - 'Web app: Sensors & thresholds'
      security: []
      description: |
        Returns the aggregated built-in AirBeam sensors plus every distinct contributed
        sensor for the given `session_type` (with a per-sensor `session_count`). Public
        (no auth). Cached for 8 hours. Built-in aggregated rows have `id: null` and
        `session_count: 0`.
      parameters:
      - name: session_type
        in: query
        required: true
        description: 'STI session class name: "MobileSession" or "FixedSession"'
        schema:
          type: string
      responses:
        '200':
          description: sensors
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - sensor_name
                  - measurement_type
                  - unit_symbol
                  - session_count
                  properties:
                    id:
                      type: integer
                      nullable: true
                      description: null for built-in aggregated sensors
                    session_count:
                      type: integer
                      example: 0
                    sensor_name:
                      type: string
                      example: AirBeam-PM2.5
                    measurement_type:
                      type: string
                      example: Particulate Matter
                    unit_symbol:
                      type: string
                      example: µg/m³
        '400':
          description: validation error (missing session_type)
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                example:
                  field_name:
                  - error message
