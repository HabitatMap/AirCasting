---
openapi: 3.0.1
info:
  title: AirCasting Mobile & Web API
  version: 1.0.0
  description: Endpoints used by the AirCasting mobile apps and web frontend. Spans
    several route namespaces (/api, /api/fixed, /api/mobile, /api/v3, …), not only
    /api/v3.
components:
  securitySchemes:
    token_auth:
      type: apiKey
      in: header
      name: Authorization
      description: Token token=<user_token>
security:
- token_auth: []
tags:
- name: Fixed sessions
  description: 'AirBeam fixed (stationary) sessions: create/upload, stream detail,
    measurements, daily averages, and the fixed map lists (also serve government stations).'
- name: Mobile sessions
  description: 'AirBeam mobile (moving) sessions: list and single stream detail.'
- name: Government stations
  description: 'Government (EEA/EPA) air-quality stations from the new station_streams
    model: detail, measurements, daily averages, CSV export.'
- name: Map aggregations
  description: CrowdMap grid averages, region summary, and timelapse clusters.
- name: Autocomplete
  description: Filter autocomplete for tag names and usernames.
- name: Sensors & thresholds
  description: Sensor lists and threshold sets (model-agnostic lookups).
- name: Export & sharing
  description: Session CSV export and short-URL creation.
paths:
  "/api/fixed/autocomplete/tags":
    get:
      summary: Autocomplete fixed-session tag names
      tags:
      - Autocomplete
      security: []
      description: Returns matching fixed-session tag names as a string array. Public
        (no auth). Uses nested q[...] params.
      parameters:
      - name: q[input]
        in: query
        required: false
        description: Search prefix (may be empty)
        schema:
          type: string
      - name: q[time_from]
        in: query
        required: true
        description: Epoch seconds
        schema:
          type: integer
      - name: q[time_to]
        in: query
        required: true
        description: Epoch seconds
        schema:
          type: integer
      - name: q[sensor_name]
        in: query
        required: true
        schema:
          type: string
      - name: q[unit_symbol]
        in: query
        required: true
        schema:
          type: string
      - name: q[usernames]
        in: query
        required: false
        description: Cross-filter usernames (may be empty)
        schema:
          type: string
      - name: q[west]
        in: query
        required: true
        schema:
          type: number
      - name: q[east]
        in: query
        required: true
        schema:
          type: number
      - name: q[south]
        in: query
        required: true
        schema:
          type: number
      - name: q[north]
        in: query
        required: true
        schema:
          type: number
      - name: q[is_indoor]
        in: query
        required: true
        schema:
          type: boolean
      - name: q[is_active]
        in: query
        required: true
        schema:
          type: boolean
      responses:
        '200':
          description: tag names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  "/api/mobile/autocomplete/tags":
    get:
      summary: Autocomplete mobile-session tag names
      tags:
      - Autocomplete
      security: []
      description: Returns matching mobile-session tag names as a string array. Public
        (no auth). Uses nested q[...] params.
      parameters:
      - name: q[input]
        in: query
        required: false
        description: Search prefix (may be empty)
        schema:
          type: string
      - name: q[time_from]
        in: query
        required: true
        description: Epoch seconds
        schema:
          type: integer
      - name: q[time_to]
        in: query
        required: true
        description: Epoch seconds
        schema:
          type: integer
      - name: q[sensor_name]
        in: query
        required: true
        schema:
          type: string
      - name: q[unit_symbol]
        in: query
        required: true
        schema:
          type: string
      - name: q[usernames]
        in: query
        required: false
        schema:
          type: string
      - name: q[west]
        in: query
        required: true
        schema:
          type: number
      - name: q[east]
        in: query
        required: true
        schema:
          type: number
      - name: q[south]
        in: query
        required: true
        schema:
          type: number
      - name: q[north]
        in: query
        required: true
        schema:
          type: number
      responses:
        '200':
          description: tag names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  "/api/autocomplete/usernames":
    get:
      summary: Autocomplete usernames
      tags:
      - Autocomplete
      security: []
      description: 'Returns matching contributor usernames as a sorted, unique string
        array. Public (no auth). Uses nested q[...] params. Note: is_dormant is a
        string "true"/"false", session_type is "fixed" or "mobile".'
      parameters:
      - name: q[input]
        in: query
        required: false
        description: Search prefix (may be empty)
        schema:
          type: string
      - name: q[time_from]
        in: query
        required: true
        description: Epoch seconds
        schema:
          type: integer
      - name: q[time_to]
        in: query
        required: true
        description: Epoch seconds
        schema:
          type: integer
      - name: q[sensor_name]
        in: query
        required: true
        schema:
          type: string
      - name: q[unit_symbol]
        in: query
        required: true
        schema:
          type: string
      - name: q[tags]
        in: query
        required: false
        description: Cross-filter tags (may be empty)
        schema:
          type: string
      - name: q[west]
        in: query
        required: true
        schema:
          type: number
      - name: q[east]
        in: query
        required: true
        schema:
          type: number
      - name: q[south]
        in: query
        required: true
        schema:
          type: number
      - name: q[north]
        in: query
        required: true
        schema:
          type: number
      - name: q[session_type]
        in: query
        required: true
        description: '"fixed" or "mobile"'
        schema:
          type: string
      - name: q[is_dormant]
        in: query
        required: true
        description: '"true" or "false"'
        schema:
          type: string
      responses:
        '200':
          description: usernames
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  "/api/averages2.json":
    get:
      summary: CrowdMap grid-cell averages in a bounding box
      tags:
      - Map aggregations
      security: []
      description: |
        Returns averaged measurement values over a grid, for the CrowdMap. Public (no auth).
        `q` is URL-encoded JSON with: `north`, `south`, `east`, `west` (float);
        `time_from`, `time_to`, `day_from`, `day_to`, `year_from`, `year_to`,
        `grid_size_x`, `grid_size_y` (int); `measurement_type`, `sensor_name`,
        `unit_symbol`, `usernames`, `tags` (string); `stream_ids` (array of int, optional).
      parameters:
      - name: q
        in: query
        required: true
        description: URL-encoded JSON filter
        schema:
          type: string
      responses:
        '200':
          description: grid averages
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - value
                  - west
                  - east
                  - south
                  - north
                  properties:
                    value:
                      type: number
                      format: float
                    west:
                      type: number
                      format: float
                    east:
                      type: number
                      format: float
                    south:
                      type: number
                      format: float
                    north:
                      type: number
                      format: float
  "/api/region.json":
    get:
      summary: Region summary (average, contributors, samples)
      tags:
      - Map aggregations
      security: []
      description: |
        Returns a summary for a rectangular region. Public (no auth). Uses **flat** query
        params (not a `q` wrapper): `north`, `south`, `east`, `west` (float);
        `time_from`, `time_to`, `grid_size_x`, `grid_size_y` (int); `usernames`,
        `tags` (string); `stream_ids` (comma-separated string).
      parameters:
      - name: north
        in: query
        required: true
        schema:
          type: number
      - name: south
        in: query
        required: true
        schema:
          type: number
      - name: east
        in: query
        required: true
        schema:
          type: number
      - name: west
        in: query
        required: true
        schema:
          type: number
      - name: time_from
        in: query
        required: false
        description: Epoch seconds
        schema:
          type: integer
      - name: time_to
        in: query
        required: false
        description: Epoch seconds
        schema:
          type: integer
      - name: sensor_name
        in: query
        required: false
        schema:
          type: string
      - name: measurement_type
        in: query
        required: false
        schema:
          type: string
      - name: unit_symbol
        in: query
        required: false
        schema:
          type: string
      - name: usernames
        in: query
        required: false
        schema:
          type: string
      - name: tags
        in: query
        required: false
        schema:
          type: string
      - name: stream_ids
        in: query
        required: false
        description: Comma-separated stream ids
        schema:
          type: string
      responses:
        '200':
          description: region summary
          content:
            application/json:
              schema:
                type: object
                required:
                - average
                - number_of_contributors
                - number_of_samples
                properties:
                  average:
                    type: number
                    format: float
                    nullable: true
                  number_of_contributors:
                    type: integer
                  number_of_samples:
                    type: integer
  "/api/v3/timelapse":
    get:
      summary: Timelapse clusters by hour
      tags:
      - Map aggregations
      security: []
      description: |
        Returns clustered hourly averages for the timelapse animation. Public (no auth).
        Response is an object keyed by hour timestamp ("YYYY-MM-DD HH:MM:SS +0000"),
        each value an array of cluster points. `q` is URL-encoded JSON validated by the
        same contract as the fixed session lists (required: `time_from`, `time_to`
        (epoch seconds), `sensor_name`, `measurement_type`, `unit_symbol`, `tags`,
        `usernames`; optional bbox + `zoom_level`). Government sensors are supported.
      parameters:
      - name: q
        in: query
        required: true
        description: URL-encoded JSON filter
        schema:
          type: string
      responses:
        '200':
          description: clusters keyed by hour
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: object
                    required:
                    - value
                    - latitude
                    - longitude
                    - sessions
                    properties:
                      value:
                        type: number
                        format: float
                      latitude:
                        type: number
                        format: float
                      longitude:
                        type: number
                        format: float
                      sessions:
                        type: integer
                        description: Number of streams in the cluster
  "/api/sessions/export.json":
    get:
      summary: Schedule a CSV export of sessions (emailed)
      tags:
      - Export & sharing
      security: []
      description: |
        Schedules a background CSV export of the given sessions and emails the result.
        Public (no auth). All ids must be the same kind (all mobile or all fixed) and,
        for fixed sessions, must include streams.
      parameters:
      - name: session_ids[]
        in: query
        required: true
        schema:
          type: array
          items:
            type: integer
        style: form
        explode: true
        description: sessions.id list
      - name: email
        in: query
        required: true
        description: Recipient email
        schema:
          type: string
      responses:
        '200':
          description: export scheduled
          content:
            application/json:
              schema:
                type: string
                example: Export scheduled successfully.
        '400':
          description: validation error
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  "/api/short_url":
    post:
      summary: Shorten a same-host URL
      tags:
      - Export & sharing
      security: []
      description: Creates a shortened link for a URL on the same host. Public (no
        auth). Returns the shortened URL; off-host URLs are rejected with 422.
      parameters: []
      responses:
        '200':
          description: shortened
          content:
            application/json:
              schema:
                type: object
                required:
                - short_url
                properties:
                  short_url:
                    type: string
                    example: http://www.example.com/l/abc12
        '422':
          description: invalid or off-host URL
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Invalid URL
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - longUrl
              properties:
                longUrl:
                  type: string
                  example: http://www.example.com/fixed_map?foo=bar
        required: true
  "/api/fixed/active/sessions2.json":
    get:
      summary: Active fixed sessions in a bounding box (AirBeam + government)
      tags:
      - Fixed sessions
      security: []
      description: |
        Returns active fixed sessions as map markers. Public (no auth). Response is gzipped.

        URL-encoded JSON object. Fields:
        required `time_from`, `time_to` (Unix epoch **seconds**), `sensor_name`,
        `measurement_type`, `unit_symbol`, `tags` (string, may be empty),
        `usernames` (string, may be empty); optional `is_indoor` (bool),
        `west`/`east`/`south`/`north` (float), `limit`/`offset`/`zoom_level` (int).
        A `sensor_name` of government-pm2.5 / government-no2 / government-ozone
        returns government stations from the new station_streams model.
      parameters:
      - name: q
        in: query
        required: true
        description: |
          URL-encoded JSON object. Fields:
          required `time_from`, `time_to` (Unix epoch **seconds**), `sensor_name`,
          `measurement_type`, `unit_symbol`, `tags` (string, may be empty),
          `usernames` (string, may be empty); optional `is_indoor` (bool),
          `west`/`east`/`south`/`north` (float), `limit`/`offset`/`zoom_level` (int).
          A `sensor_name` of government-pm2.5 / government-no2 / government-ozone
          returns government stations from the new station_streams model.
        schema:
          type: string
      responses:
        '200':
          description: active sessions
          content:
            application/json:
              schema:
                type: object
                required:
                - fetchableSessionsCount
                - sessions
                properties:
                  fetchableSessionsCount:
                    type: integer
                    example: 0
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: 'AirBeam: sessions.id. Government: station_streams.id'
                        uuid:
                          type: string
                        end_time_local:
                          type: string
                          nullable: true
                          description: Local wall time, e.g. 2026-08-01T10:00:00.000Z
                        start_time_local:
                          type: string
                          nullable: true
                        last_measurement_value:
                          type: integer
                          nullable: true
                        is_indoor:
                          type: boolean
                        latitude:
                          type: number
                          format: float
                        longitude:
                          type: number
                          format: float
                        title:
                          type: string
                        username:
                          type: string
                          description: AirBeam owner username / "anonymous" (indoor);
                            "Government" for gov stations
                        is_active:
                          type: boolean
                        last_hourly_average_value:
                          type: number
                          nullable: true
                          description: AirBeam branch only
                        streams:
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              measurement_short_type:
                                type: string
                                example: PM
                              sensor_name:
                                type: string
                                example: AirBeam2-PM2.5
                              unit_symbol:
                                type: string
                                example: µg/m³
                              id:
                                type: integer
                              stream_daily_average:
                                description: 'AirBeam branch only: rounded integer
                                  or the string "no data"'
                                example: 12
                          description: Keyed by sensor_name
        '400':
          description: validation error (invalid q)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  "/api/fixed/dormant/sessions.json":
    get:
      summary: Dormant fixed sessions in a bounding box (AirBeam + government)
      tags:
      - Fixed sessions
      security: []
      description: |
        Returns dormant (inactive) fixed sessions with full per-stream metadata. Public (no auth).

        URL-encoded JSON object. Fields:
        required `time_from`, `time_to` (Unix epoch **seconds**), `sensor_name`,
        `measurement_type`, `unit_symbol`, `tags` (string, may be empty),
        `usernames` (string, may be empty); optional `is_indoor` (bool),
        `west`/`east`/`south`/`north` (float), `limit`/`offset`/`zoom_level` (int).
        A `sensor_name` of government-pm2.5 / government-no2 / government-ozone
        returns government stations from the new station_streams model.
      parameters:
      - name: q
        in: query
        required: true
        description: |
          URL-encoded JSON object. Fields:
          required `time_from`, `time_to` (Unix epoch **seconds**), `sensor_name`,
          `measurement_type`, `unit_symbol`, `tags` (string, may be empty),
          `usernames` (string, may be empty); optional `is_indoor` (bool),
          `west`/`east`/`south`/`north` (float), `limit`/`offset`/`zoom_level` (int).
          A `sensor_name` of government-pm2.5 / government-no2 / government-ozone
          returns government stations from the new station_streams model.
        schema:
          type: string
      responses:
        '200':
          description: dormant sessions
          content:
            application/json:
              schema:
                type: object
                required:
                - sessions
                - fetchableSessionsCount
                properties:
                  fetchableSessionsCount:
                    type: integer
                    example: 0
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        start_time_local:
                          type: string
                        end_time_local:
                          type: string
                        is_indoor:
                          type: boolean
                        latitude:
                          type: number
                          format: float
                        longitude:
                          type: number
                          format: float
                        type:
                          type: string
                          description: STI class, e.g. FixedSession
                        username:
                          type: string
                        last_hourly_average_value:
                          type: number
                          nullable: true
                        streams:
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              average_value:
                                type: number
                                nullable: true
                              id:
                                type: integer
                              max_latitude:
                                type: number
                                format: float
                              max_longitude:
                                type: number
                                format: float
                              measurement_short_type:
                                type: string
                              measurement_type:
                                type: string
                              measurements_count:
                                type: integer
                              min_latitude:
                                type: number
                                format: float
                              min_longitude:
                                type: number
                                format: float
                              sensor_name:
                                type: string
                              sensor_package_name:
                                type: string
                              session_id:
                                type: integer
                              size:
                                type: integer
                              start_latitude:
                                type: number
                                format: float
                              start_longitude:
                                type: number
                                format: float
                              threshold_high:
                                type: number
                              threshold_low:
                                type: number
                              threshold_medium:
                                type: number
                              threshold_very_high:
                                type: number
                              threshold_very_low:
                                type: number
                              unit_name:
                                type: string
                              unit_symbol:
                                type: string
  "/api/mobile/sessions.json":
    get:
      summary: Mobile sessions in a bounding box
      tags:
      - Mobile sessions
      security: []
      description: |
        Returns mobile (moving) sessions with per-stream metadata. Public (no auth).

        URL-encoded JSON object. All fields required: `time_from`, `time_to`
        (Unix epoch **seconds**), `sensor_name`, `measurement_type`, `unit_symbol`,
        `tags` (string, may be empty), `usernames` (string, may be empty),
        `west`, `east`, `south`, `north` (float), `limit`, `offset` (int).
      parameters:
      - name: q
        in: query
        required: true
        description: |
          URL-encoded JSON object. All fields required: `time_from`, `time_to`
          (Unix epoch **seconds**), `sensor_name`, `measurement_type`, `unit_symbol`,
          `tags` (string, may be empty), `usernames` (string, may be empty),
          `west`, `east`, `south`, `north` (float), `limit`, `offset` (int).
        schema:
          type: string
      responses:
        '200':
          description: mobile sessions
          content:
            application/json:
              schema:
                type: object
                required:
                - sessions
                - fetchableSessionsCount
                properties:
                  fetchableSessionsCount:
                    type: integer
                    example: 0
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        start_time_local:
                          type: string
                        end_time_local:
                          type: string
                        type:
                          type: string
                          description: STI class, e.g. MobileSession
                        username:
                          type: string
                        streams:
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              average_value:
                                type: integer
                              id:
                                type: integer
                              max_latitude:
                                type: number
                                format: float
                              max_longitude:
                                type: number
                                format: float
                              measurement_short_type:
                                type: string
                              measurement_type:
                                type: string
                              measurements_count:
                                type: integer
                              min_latitude:
                                type: number
                                format: float
                              min_longitude:
                                type: number
                                format: float
                              sensor_name:
                                type: string
                              sensor_package_name:
                                type: string
                              session_id:
                                type: integer
                              size:
                                type: integer
                              start_latitude:
                                type: number
                                format: float
                              start_longitude:
                                type: number
                                format: float
                              threshold_high:
                                type: number
                              threshold_low:
                                type: number
                              threshold_medium:
                                type: number
                              threshold_very_high:
                                type: number
                              threshold_very_low:
                                type: number
                              unit_name:
                                type: string
                              unit_symbol:
                                type: string
        '400':
          description: validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    text:
                      type: string
                      example: is missing
                    path:
                      type: array
                      items:
                        type: string
                      example:
                      - unit_symbol
  "/api/mobile/streams/{id}":
    get:
      summary: Single mobile stream with measurements
      tags:
      - Mobile sessions
      security: []
      description: Returns one mobile stream (legacy streams.id) with all its measurements
        and notes. Public (no auth). Times are epoch milliseconds.
      parameters:
      - name: id
        in: path
        required: true
        description: Legacy streams.id (mobile)
        schema:
          type: integer
      responses:
        '200':
          description: stream found
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - streamId
                - sensorName
                - title
                - measurements
                properties:
                  title:
                    type: string
                  username:
                    type: string
                    description: '"anonymous" for indoor sessions'
                  sensorName:
                    type: string
                  measurements:
                    type: array
                    items:
                      type: object
                      required:
                      - value
                      - time
                      - longitude
                      - latitude
                      properties:
                        value:
                          type: number
                          format: float
                        time:
                          type: integer
                          format: int64
                          description: Epoch milliseconds
                        longitude:
                          type: number
                          format: float
                        latitude:
                          type: number
                          format: float
                  startTime:
                    type: integer
                    format: int64
                    nullable: true
                  endTime:
                    type: integer
                    format: int64
                    nullable: true
                  id:
                    type: integer
                    description: Session id
                  streamId:
                    type: integer
                  sensorUnit:
                    type: string
                  averageValue:
                    type: integer
                    nullable: true
                  maxLatitude:
                    type: number
                    format: float
                    nullable: true
